# Git hooks managed by lefthook (installed by `pnpm install`).
pre-commit:
  commands:
    gitleaks:
      run: sh scripts/gitleaks-staged.sh
    markdownlint:
      glob: "*.md"
      run: pnpm exec markdownlint-cli2 {staged_files}
    prettier:
      glob: "*.{js,mjs,cjs,ts,tsx,json,jsonc,yml,yaml}"
      run: pnpm exec prettier --check {staged_files}
