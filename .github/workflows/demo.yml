name: Demo data

# Applies or removes the demo events of the public demo (ADR-0010, docs/DEPLOY.md). Runs
# only by hand, with the secrets of the "demo" environment.
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do with the demo events
        type: choice
        options:
          - seed
          - reset

permissions:
  contents: read

concurrency:
  group: demo-data
  cancel-in-progress: false

jobs:
  demo-data:
    name: Demo data (${{ inputs.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: demo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the API
        run: pnpm turbo run build --filter=@vira/api
      - name: Apply the seed
        working-directory: apps/api
        env:
          TASK: ${{ inputs.task }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        # The seed touches only the database and the bucket. The other variables the
        # configuration requires get throwaway values that nothing here uses.
        run: |
          export NODE_ENV=development WEB_ORIGIN=https://vira.invalid
          export REDIS_URL=redis://127.0.0.1:6379 SMTP_URL=smtp://127.0.0.1:1025
          export JWT_SECRET="$(openssl rand -base64 32)" CSRF_SECRET="$(openssl rand -base64 32)"
          export QR_SIGNING_KEYS="t1:$(openssl rand -base64 32)"
          if [ "$TASK" = "reset" ]; then
            node dist/main.demo-seed.js --reset
          else
            node dist/main.demo-seed.js
          fi
